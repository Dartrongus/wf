<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Трекер Инкарнон Адаптеров (Warframe)</title>
    <link rel="icon" href="https://ru.wiki.warframe.com/images/Favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-sub: #2a2a2a;
            --accent: #00bcd4;
            --accent-hover: #008ba3;
            --warning: #ff9800;
            --text-main: #e0e0e0;
            --text-muted: #999;
            --border: #333;
            --max-width: 1300px;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --card-sub: #f0f2f5;
            --accent: #009688;
            --accent-hover: #00796b;
            --warning: #f57c00;
            --text-main: #212121;
            --text-muted: #666;
            --border: #dcdcdc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            transition: max-width 0.3s ease;
        }
        .top-settings-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        
        /* Блок текущей недели */
        .current-week-banner {
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.15), rgba(255, 152, 0, 0.15));
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .current-week-title {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 5px;
        }
        .current-week-weapons {
            font-size: 0.95em;
            color: var(--text-main);
        }

        /* Прогресс-бар общий */
        .global-progress-bar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95em;
        }
        .progress-track {
            background: var(--card-sub);
            border-radius: 4px;
            height: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .dashboard {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .dashboard h3 {
            margin-top: 0;
            color: var(--warning);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .warehouse-toggle-btn {
            font-size: 0.8em;
            background: var(--card-sub);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 4px 10px;
        }
        .warehouse-toggle-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        /* Панель склада */
        .warehouse-panel {
            display: none;
            background: var(--card-sub);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px dashed var(--border);
        }
        .warehouse-panel.open {
            display: block;
        }
        .warehouse-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .warehouse-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .warehouse-item input {
            width: 60px;
            background: var(--card-sub);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 3px 5px;
            text-align: right;
            font-weight: bold;
        }

        .res-totals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .res-total-item {
            background: var(--card-sub);
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent);
        }
        .res-info-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .res-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .res-name {
            font-size: 0.95em;
            color: var(--text-main);
        }
        .res-counts {
            text-align: right;
        }
        .res-count-main {
            font-weight: bold;
            font-size: 1.05em;
            color: var(--accent);
        }
        .res-count-sub {
            font-size: 0.75em;
            color: var(--text-muted);
        }

        /* Панель фильтров и поиска */
        .filters-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input {
            flex-grow: 1;
            min-width: 250px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 9px 15px;
            border-radius: 4px;
            font-size: 0.95em;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .category-section {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }
        h2 {
            color: var(--warning);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .adapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .adapter-card {
            background: var(--card-sub);
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 6px;
            transition: opacity 0.2s, border-color 0.2s, transform 0.2s;
            position: relative;
        }
        /* Подсветка текущей недели */
        .adapter-card.current-week {
            border-left-color: #ff9800;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.3);
        }
        .current-badge {
            display: inline-block;
            background: #ff9800;
            color: #121212;
            font-size: 0.7em;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .adapter-card.hidden {
            display: none !important;
        }
        .adapter-card.completed {
            opacity: 0.5;
            border-left-color: #555;
        }
        .adapter-content {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .weapon-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            padding: 4px;
            flex-shrink: 0;
        }
        .adapter-details {
            flex-grow: 1;
        }
        .adapter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .adapter-title {
            font-weight: bold;
            font-size: 1em;
            color: var(--text-main);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.85em;
            color: var(--accent);
            user-select: none;
        }
        .checkbox-label input {
            margin-right: 4px;
            transform: scale(1.1);
            cursor: pointer;
        }
        ul {
            margin: 0;
            padding-left: 0;
            list-style: none;
            font-size: 0.9em;
            color: var(--text-muted);
        }
        li {
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .li-res-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .list-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .controls-bar {
            text-align: right;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        button, select {
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        button:hover, select:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }
        select {
            background-color: var(--card-sub);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-share {
            background-color: #2196F3;
            color: white;
        }
        .btn-share:hover {
            background-color: #1976D2;
        }
        .btn-fullscreen {
            background-color: #9c27b0;
            color: white;
        }
        .btn-fullscreen:hover {
            background-color: #7b1fa2;
        }
    </style>
</head>
<body data-theme="dark">

<div class="container" id="mainContainer">
    <div class="top-settings-bar">
        <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>
        <button id="themeToggleBtn" onclick="toggleTheme()">🌓 <span data-i18n="themeBtn">Тема</span></button>
    </div>

    <h1 data-i18n="mainTitle">Трекер Инкарнон Адаптеров</h1>
    <div class="subtitle" data-i18n="subTitle">Интерактивный трекер ресурсов для улучшений оружия</div>

    <!-- Баннер текущей недели -->
    <div class="current-week-banner" id="currentWeekBanner">
        <div class="current-week-title" id="currentWeekTitle">Загрузка информации о неделе...</div>

    <!-- Индикатор общего прогресса -->
    <div class="global-progress-bar">
        <div class="progress-info">
            <span id="progressText">Установлено: 0 из 0 (0%)</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Дашборд ресурсов и склада -->
    <div class="dashboard">
        <h3>
            <span data-i18n="dashboardTitle">Общие требования для не установленных адаптеров</span>

        </h3>
        
        <!-- Склад игрока -->
        <div class="warehouse-panel" id="warehousePanel">
            <div style="font-size: 0.9em; color: var(--text-muted); margin-bottom: 8px;" data-i18n="warehouseDesc">Укажи, сколько ресурсов у тебя уже есть. Трекер автоматически вычтет их из общего дефицита:</div>
            <div class="warehouse-grid" id="warehouseContainer"></div>
        </div>

        <div class="res-totals-grid" id="totalsContainer"></div>
    </div>

    <!-- Панель фильтров и поиска -->
    <div class="filters-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Быстрый поиск оружия..." oninput="filterAdapters()" data-i18n-placeholder="searchPlaceholder">
        <select id="statusFilter" onchange="filterAdapters()">
            <option value="all" data-i18n="filterAll">Все адаптеры</option>
            <option value="uninstalled" data-i18n="filterUninstalled">Только не установленные</option>
            <option value="installed" data-i18n="filterInstalled">Только установленные</option>
            <option value="current" data-i18n="filterCurrent">⚡ Доступны на этой неделе</option>
        </select>
    </div>

    <div class="controls-bar">
        <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreenWidth()">🖥️ На весь экран</button>
        <button class="btn-share" onclick="shareProgressLink()" data-i18n="shareBtn">🔗 Скопировать ссылку на прогресс</button>
        <button onclick="resetAll()" data-i18n="resetBtn">Сбросить все галочки</button>
    </div>

    <div id="categoriesContainer"></div>
</div>

    const UI_TEXT = {

            }

    };

    // Полный цикл из 9 недель (A-I), привязанный к вашим id адаптеров
    const incarnonRotationWeeks = [
        ["braton", "lato", "skana", "paris", "kunai"],               // Week 1 (A)
        ["boar", "gammacor", "angstrum", "gorgon", "anku"],         // Week 2 (B)
        ["bo", "latron", "furis", "furax", "strun"],                // Week 3 (C)
        ["lex", "magister", "boltor", "bronco", "ceramic_dagger"],  // Week 4 (D)
        ["torid", "toxocyst", "dual_ichor", "miter", "atomos"],     // Week 5 (E)
        ["ack_brunt", "soma", "vasto", "nami_solo", "burston"],     // Week 6 (F)
        ["zylok", "sibear", "dread", "despair", "hate"],            // Week 7 (G)
        ["dera", "cestra", "okina", "sybaris", "sicarus"],         // Week 8 (H)
        ["vectis", "stug", "ballistica", "destreza", "obex"]        // Week 9 (I)
    ];

    function getCurrentIncarnonRotation() {
        // Опорная точка: Понедельник, 24 августа 2026 года, 03:00 МСК (00:00 UTC) = начало Week 9 (индекс 8)
        const anchorDate = Date.UTC(2026, 7, 24, 0, 0, 0); 
        
        const now = new Date();
        const nowUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours(), now.getUTCMinutes());
        
        const diffMs = nowUTC - anchorDate;
        const diffWeeks = Math.floor(diffMs / (1000 * 60 * 60 * 24 * 7));
        
        // Вычисляем индекс с учетом цикличности
        let currentWeekIndex = (8 + (diffWeeks % 9)) % 9;
        
        const weekLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
        
        return {
            letter: weekLetters[currentWeekIndex],
            adapters: incarnonRotationWeeks[currentWeekIndex]
        };
    }

    const RESOURCE_NAMES = {
        pathos: { nameRu: "Струбцина Пафоса", nameEn: "Pathos Clamp", img: "https://wiki.warframe.com/images/PathosClamp.png" },

        konla: { nameRu: "Росток Конлы", nameEn: "Connla Sprout", img: "https://wiki.warframe.com/images/ConnlaSprout.png" },

        sylphs: { nameRu: "Сильфсела", nameEn: "Silphsela", img: "https://wiki.warframe.com/images/Silphsela.png" },
        tasoma: { nameRu: "Экстракт Тасомы", nameEn: "Tasoma Extract", img: "https://wiki.warframe.com/images/TasomaExtract.png" },
        ariet: { nameRu: "Ариетовая Чешуя", nameEn: "Ariette Scale", img: "https://wiki.warframe.com/images/ArietteScale.png" },
        goldfang: { nameRu: "Клык Золотой Пасти", nameEn: "Maw Fang", img: "https://wiki.warframe.com/images/MawFang.png" },
        pebble: { nameRu: "Перламутровая Галька", nameEn: "Nacreous Pebble", img: "https://wiki.warframe.com/images/NacreousPebble.png" },
        rune: { nameRu: "Руническая Сущность", nameEn: "Rune Marrow", img: "https://wiki.warframe.com/images/RuneMarrow.png" }
    };

    const categoriesData = [
        {
            categoryKey: "primary",
            adapters: [
                { id: "braton", nameRu: "Генезис Инкарнона: Брэйтон", nameEn: "Braton Incarnon Genesis", img: "https://wiki.warframe.com/images/BratonIncarnon.png", costs: { pathos: 20, rune: 60, tasoma: 60 } },
                { id: "boltor", nameRu: "Генезис Инкарнона: Болтор", nameEn: "Boltor Incarnon Genesis", img: "https://wiki.warframe.com/images/BoltorIncarnon.png", costs: { pathos: 20, rune: 60, sylphs: 60 } },
                { id: "burston", nameRu: "Генезис Инкарнона: Бёрстон", nameEn: "Burston Incarnon Genesis", img: "https://wiki.warframe.com/images/BurstonIncarnon.png", costs: { pathos: 20, rune: 60, goldfang: 20 } },
                { id: "vectis", nameRu: "Генезис Инкарнона: Вектис", nameEn: "Vectis Incarnon Genesis", img: "https://wiki.warframe.com/images/VectisIncarnon.png", costs: { pathos: 20, evani: 80, sagen: 150 } },

                { id: "dual_ichor", nameRu: "Генезис Инкарнона: Парные Ихоры", nameEn: "Dual Ichor Incarnon Genesis", img: "https://wiki.warframe.com/images/DualIchorIncarnon.png", costs: { pathos: 20, rune: 60, kovnik: 80 } },
                { id: "skana", nameRu: "Генезис Инкарнона: Скана", nameEn: "Skana Incarnon Genesis", img: "https://wiki.warframe.com/images/SkanaIncarnon.png", costs: { pathos: 20, drakroot: 70, konla: 80 } },
                { id: "sibear", nameRu: "Генезис Инкарнона: Сибирь", nameEn: "Sibear Incarnon Genesis", img: "https://wiki.warframe.com/images/SibearIncarnon.png", costs: { pathos: 20, drakroot: 70, konla: 80 } },
                { id: "furax", nameRu: "Генезис Инкарнона: Фуракс", nameEn: "Furax Incarnon Genesis", img: "https://wiki.warframe.com/images/FuraxIncarnon.png", costs: { pathos: 20, drakroot: 70, ariet: 300 } }
            ]
        }
    ];

    let currentLang = localStorage.getItem('incarnon_lang') || 'ru';
    let currentTheme = localStorage.getItem('incarnon_theme') || 'dark';
    let isFullscreenWidth = localStorage.getItem('incarnon_fullscreen') === 'true';

    function initSettings() {
        document.getElementById('langSelect').value = currentLang;
        document.body.setAttribute('data-theme', currentTheme);
        if (isFullscreenWidth) {
            document.getElementById('mainContainer').style.maxWidth = '100%';
        }
        loadFromURLOrStorage();
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', currentTheme);
        localStorage.setItem('incarnon_theme', currentTheme);
    }

    function toggleFullscreenWidth() {
        isFullscreenWidth = !isFullscreenWidth;
        localStorage.setItem('incarnon_fullscreen', isFullscreenWidth);
        const container = document.getElementById('mainContainer');
        container.style.maxWidth = isFullscreenWidth ? '100%' : '1300px';
        applyTranslations();
    }

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('incarnon_lang', lang);
        applyTranslations();
        renderApp();
    }

    function applyTranslations() {
        const t = UI_TEXT[currentLang];
        document.getElementById('pageTitle').innerText = t.pageTitle;
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.innerText = t[key];
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) el.placeholder = t[key];
        });

        const fsBtn = document.getElementById('fullscreenBtn');
        fsBtn.innerText = isFullscreenWidth ? t.fullscreenOff : t.fullscreenOn;

        updateCurrentWeekBanner();
    }

    function updateCurrentWeekBanner() {
        const rotation = getCurrentIncarnonRotation();
        const t = UI_TEXT[currentLang];
        
        document.getElementById('currentWeekTitle').innerText = t.currentWeekLabel.replace('{week}', rotation.letter);
        
        // Находим человекочитаемые названия пушек для текущей недели
        let namesList = [];
        rotation.adapters.forEach(id => {
            categoriesData.forEach(cat => {
                cat.adapters.forEach(a => {
                    if (a.id === id) {
                        namesList.push(currentLang === 'en' ? a.nameEn.replace(' Incarnon Genesis', '') : a.nameRu.replace('Генезис Инкарнона: ', ''));
                    }
                });
            });
        });
        document.getElementById('currentWeekWeapons').innerText = namesList.join(' • ');
    }

    function getAllAdapterIds() {
        let ids = [];
        categoriesData.forEach(cat => cat.adapters.forEach(a => ids.push(a.id)));
        return ids;
    }

    function saveState() {
        const ids = getAllAdapterIds();
        let binaryString = "";
        ids.forEach(id => {
            const isChecked = localStorage.getItem('incarnon_' + id) === 'true';
            binaryString += isChecked ? "1" : "0";
        });

        let hexString = "";
        for (let i = 0; i < binaryString.length; i += 4) {
            let chunk = binaryString.substr(i, 4).padEnd(4, "0");
            hexString += parseInt(chunk, 2).toString(16);
        }

        history.replaceState(null, "", "#" + hexString);
    }

    function loadFromURLOrStorage() {
        const hash = window.location.hash.replace("#", "").trim();
        const ids = getAllAdapterIds();

        if (hash.length > 0) {
            let binaryString = "";
            for (let i = 0; i < hash.length; i++) {
                let val = parseInt(hash[i], 16);
                if (!isNaN(val)) {
                    binaryString += val.toString(2).padStart(4, "0");
                }
            }
            ids.forEach((id, index) => {
                const bit = binaryString[index] === "1";
                localStorage.setItem('incarnon_' + id, bit ? 'true' : 'false');
            });
        } else {
            ids.forEach(id => {
                if (localStorage.getItem('incarnon_' + id) === null) {
                    localStorage.setItem('incarnon_' + id, 'false');
                }
            });
        }
    }

    function shareProgressLink() {
        saveState();
        const t = UI_TEXT[currentLang].alerts;
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert(t.linkCopied);
        }).catch(err => {
            prompt("Скопируйте ссылку вручную:", window.location.href);
        });
    }

    function toggleWarehouse() {
        const panel = document.getElementById('warehousePanel');
        panel.classList.toggle('open');
    }

    function renderWarehouseInputs() {
        const container = document.getElementById('warehouseContainer');
        container.innerHTML = '';

        Object.keys(RESOURCE_NAMES).forEach(resKey => {
            const res = RESOURCE_NAMES[resKey];
            const resName = currentLang === 'en' ? res.nameEn : res.nameRu;
            const currentStock = localStorage.getItem('warehouse_' + resKey) || 0;

            const div = document.createElement('div');
            div.className = 'warehouse-item';
            div.innerHTML = `
                <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
                    <img src="${res.img}" style="width:18px; height:18px; object-fit:contain;" alt="">
                    <span style="font-size:0.85em; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;" title="${resName}">${resName}</span>
                </div>
                <input type="number" min="0" value="${currentStock}" onchange="updateWarehouseStock('${resKey}', this.value)">
            `;
            container.appendChild(div);
        });
    }

    function updateWarehouseStock(resKey, val) {
        const num = Math.max(0, parseInt(val) || 0);
        localStorage.setItem('warehouse_' + resKey, num);
        updateTotals();
    }

    function renderApp() {
        applyTranslations();
        renderWarehouseInputs();
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';
        const t = UI_TEXT[currentLang];
        const currentRotation = getCurrentIncarnonRotation();

        categoriesData.forEach(cat => {
            const section = document.createElement('div');
            section.className = 'category-section';
            const catTitle = t.categories[cat.categoryKey] || cat.categoryKey;
            
            let gridHtml = `<div class="adapter-grid">`;
            cat.adapters.forEach(adapter => {
                const isChecked = localStorage.getItem('incarnon_' + adapter.id) === 'true';
                const weaponName = currentLang === 'en' ? adapter.nameEn : adapter.nameRu;
                const isCurrentWeek = currentRotation.adapters.includes(adapter.id);
                
                let costsList = '';
                for (let [resKey, amount] of Object.entries(adapter.costs)) {
                    const res = RESOURCE_NAMES[resKey] || { nameRu: resKey, nameEn: resKey, img: '' };
                    const resName = currentLang === 'en' ? res.nameEn : res.nameRu;
                    costsList += `
                        <li>
                            <div class="li-res-left">
                                <img src="${res.img}" class="list-icon" alt="">
                                <span>${resName}:</span>
                            </div>
                            <strong>${amount.toLocaleString()}</strong>
                        </li>`;
                }

                gridHtml += `
                    <div class="adapter-card ${isChecked ? 'completed' : ''} ${isCurrentWeek ? 'current-week' : ''}" id="card_${adapter.id}" data-name="${weaponName.toLowerCase()}" data-checked="${isChecked}" data-current="${isCurrentWeek}">
                        <div class="adapter-content">
                            <img src="${adapter.img}" class="weapon-img" alt="">
                            <div class="adapter-details">
                                <div class="adapter-header">
                                    <span class="adapter-title">
                                        ${weaponName}
                                        ${isCurrentWeek ? `<span class="current-badge">${t.currentBadgeText}</span>` : ''}
                                    </span>
                                    <label class="checkbox-label">
                                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleAdapter('${adapter.id}')"> ${t.installed}
                                    </label>
                                </div>
                                <ul>
                                    ${costsList}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            });
            gridHtml += `</div>`;

            section.innerHTML = `<h2><span>${catTitle}</span></h2>` + gridHtml;
            container.appendChild(section);
        });

        updateTotals();
        filterAdapters();
    }

    function toggleAdapter(id) {
        const checkbox = document.querySelector(`#card_${id} input[type="checkbox"]`);
        const card = document.getElementById(`card_${id}`);
        
        if (checkbox.checked) {
            localStorage.setItem('incarnon_' + id, 'true');
            card.classList.add('completed');
            card.setAttribute('data-checked', 'true');
        } else {
            localStorage.setItem('incarnon_' + id, 'false');
            card.classList.remove('completed');
            card.setAttribute('data-checked', 'false');
        }
        saveState();
        updateTotals();
        updateGlobalProgress();
        filterAdapters();
    }

    function resetAll() {
        categoriesData.forEach(cat => {
            cat.adapters.forEach(adapter => {
                localStorage.setItem('incarnon_' + adapter.id, 'false');
            });
        });
        saveState();
        renderApp();
    }

    function filterAdapters() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const status = document.getElementById('statusFilter').value;

        const cards = document.querySelectorAll('.adapter-card');
        cards.forEach(card => {
            const name = card.getAttribute('data-name');
            const isChecked = card.getAttribute('data-checked') === 'true';
            const isCurrent = card.getAttribute('data-current') === 'true';

            let matchesSearch = name.includes(query);
            let matchesStatus = true;

            if (status === 'uninstalled') matchesStatus = !isChecked;
            if (status === 'installed') matchesStatus = isChecked;
            if (status === 'current') matchesStatus = isCurrent;

            if (matchesSearch && matchesStatus) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    function updateGlobalProgress() {
        const ids = getAllAdapterIds();
        let total = ids.length;
        let completed = 0;

        ids.forEach(id => {
            if (localStorage.getItem('incarnon_' + id) === 'true') {
                completed++;
            }
        });

        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        const t = currentLang === 'en' ? `Installed: ${completed} of ${total} (${percent}%)` : `Установлено: ${completed} из ${total} (${percent}%)`;

        document.getElementById('progressText').innerText = t;
        document.getElementById('progressPercent').innerText = percent + '%';
        document.getElementById('progressFill').style.width = percent + '%';
    }

    function updateTotals() {
        const totals = {};
        Object.keys(RESOURCE_NAMES).forEach(key => { totals[key] = 0; });

        categoriesData.forEach(cat => {
            cat.adapters.forEach(adapter => {
                const isChecked = localStorage.getItem('incarnon_' + adapter.id) === 'true';
                if (!isChecked) {
                    for (let [resKey, amount] of Object.entries(adapter.costs)) {
                        totals[resKey] = (totals[resKey] || 0) + amount;
                    }
                }
            });
        });

        const totalsContainer = document.getElementById('totalsContainer');
        totalsContainer.innerHTML = '';

        const t = UI_TEXT[currentLang];

        for (let [resKey, totalAmount] of Object.entries(totals)) {
            if (totalAmount > 0) {
                const res = RESOURCE_NAMES[resKey] || { nameRu: resKey, nameEn: resKey, img: '' };
                const resName = currentLang === 'en' ? res.nameEn : res.nameRu;
                const stock = parseInt(localStorage.getItem('warehouse_' + resKey)) || 0;
                const deficit = Math.max(0, totalAmount - stock);

                const item = document.createElement('div');
                item.className = 'res-total-item';
                
                let countsHtml = `<span class="res-count-main">${deficit.toLocaleString()}</span>`;
                if (stock > 0) {
                    let subText = t.warehouseSub
                        .replace('{total}', totalAmount.toLocaleString())
                        .replace('{stock}', stock.toLocaleString());

                    countsHtml = `
                        <div class="res-counts">
                            <div class="res-count-main" style="color: ${deficit === 0 ? '#4CAF50' : 'var(--accent)'}">${deficit === 0 ? t.warehouseEnough : deficit.toLocaleString()}</div>
                            <div class="res-count-sub">${subText}</div>
                        </div>
                    `;
                }

                item.innerHTML = `
                    <div class="res-info-wrapper">
                        <img src="${res.img}" class="res-icon" alt="">
                        <span class="res-name">${resName}</span>
                    </div>
                    ${countsHtml}
                `;
                totalsContainer.appendChild(item);
            }
        }
        updateGlobalProgress();
    }

    window.onload = () => {
        initSettings();
        renderApp();
    };
</script>
