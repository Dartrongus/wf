        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;

            --accent: #00bcd4;
            --accent-hover: #008ba3;
            --warning: #ff9800;
            --text-main: #e0e0e0;
            --text-muted: #999;
            --border: #333;
            --max-width: 1300px;
        }

        [data-theme="light"] {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --card-sub: #f0f2f5;
            --accent: #009688;
            --accent-hover: #00796b;
            --warning: #f57c00;
            --text-main: #212121;
            --text-muted: #666;
            --border: #dcdcdc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            transition: max-width 0.3s ease;
        }
        .top-settings-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }
        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .dashboard {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .dashboard h3 {
            margin-top: 0;
            color: var(--warning);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .res-totals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .res-total-item {
            background: var(--card-sub);
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent);
        }
        .res-info-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .res-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .res-name {
            font-size: 0.95em;
            color: var(--text-main);
        }
        .res-count {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--accent);
        }
        .category-section {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
        }
        h2 {
            color: var(--warning);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-top: 0;
        }
        .adapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .adapter-card {
            background: var(--card-sub);
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 6px;
            transition: opacity 0.2s, border-color 0.2s;
            position: relative;
        }
        .adapter-card.completed {
            opacity: 0.5;
            border-left-color: #555;
        }
        .adapter-content {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .weapon-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            padding: 4px;
            flex-shrink: 0;
        }
        .adapter-details {
            flex-grow: 1;
        }
        .adapter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .adapter-title {
            font-weight: bold;
            font-size: 1em;
            color: var(--text-main);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.85em;
            color: var(--accent);
            user-select: none;
        }
        .checkbox-label input {
            margin-right: 4px;
            transform: scale(1.1);
            cursor: pointer;
        }
        ul {
            margin: 0;
            padding-left: 0;
            list-style: none;
            font-size: 0.9em;
            color: var(--text-muted);
        }
        li {
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .li-res-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .list-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .controls-bar {
            text-align: right;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        button, select {
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        button:hover, select:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }
        select {
            background-color: var(--card-sub);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-export {
            background-color: #4CAF50;
            color: white;
        }
        .btn-export:hover {
            background-color: #388E3C;
        }
        .btn-import {
            background-color: #2196F3;
            color: white;
        }
        .btn-import:hover {
            background-color: #1976D2;
        }
        .btn-fullscreen {
            background-color: #9c27b0;
            color: white;
        }
        .btn-fullscreen:hover {
            background-color: #7b1fa2;
        }
    </style>
</head>

                { id: "nami_solo", nameRu: "Генезис Инкарнона: Нами Соло", nameEn: "Nami Solo Incarnon Genesis", img: "https://wiki.warframe.com/images/NamiSoloIncarnon.png", costs: { pathos: 20, drakroot: 70, aggri: 150 } },
                { id: "okina", nameRu: "Генезис Инкарнона: Окина", nameEn: "Okina Incarnon Genesis", img: "https://wiki.warframe.com/images/OkinaIncarnon.png", costs: { pathos: 20, goldfang: 20, lament: 80 } },
                { id: "obex", nameRu: "Генезис Инкарнона: Обекс", nameEn: "Obex Incarnon Genesis", img: "https://wiki.warframe.com/images/ObexIncarnon.png", costs: { pathos: 20, pebble: 100, lament: 80 } },
                { id: "dual_ichor", nameRu: "Генезис Инкарнона: Парные Ихоры", nameEn: "Dual Ichor Incarnon Genesis", img: "https://wiki.warframe.com/images/DualIchorIncarnon.png", costs: { pathos: 20, rune: 60, kovnik: 80 } },
                { id: "skana", nameRu: "Генезис Инкарнона: Скана", nameEn: "Skana Incarnon Genesis", img: "https://wiki.warframe.com/images/SkanaIncarnon.png", costs: { pathos: 20, drakroot: 70, konla: 80 } },
                { id: "sibear", nameRu: "Генезис Инкарнона: Сибирь", nameEn: "Sibear Incarnon Genesis", img: "https://wiki.warframe.com/images/SibearIncarnon.png", costs: { pathos: 20, drakroot: 70, konla: 80 } },
                { id: "furax", nameRu: "Генезис Инкарнона: Фуракс", nameEn: "Furax Incarnon Genesis", img: "https://wiki.warframe.com/images/FuraxIncarnon.png", costs: { pathos: 20, drakroot: 70, ariet: 300 } }
            ]
        }
    ];

    let currentLang = localStorage.getItem('incarnon_lang') || 'ru';
    let currentTheme = localStorage.getItem('incarnon_theme') || 'dark';
    let isFullscreenWidth = localStorage.getItem('incarnon_fullscreen') === 'true';

    function initSettings() {
        document.getElementById('langSelect').value = currentLang;
        document.body.setAttribute('data-theme', currentTheme);
        if (isFullscreenWidth) {
            document.getElementById('mainContainer').style.maxWidth = '100%';
        }
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', currentTheme);
        localStorage.setItem('incarnon_theme', currentTheme);
    }

    function toggleFullscreenWidth() {
        isFullscreenWidth = !isFullscreenWidth;
        localStorage.setItem('incarnon_fullscreen', isFullscreenWidth);
        const container = document.getElementById('mainContainer');
        container.style.maxWidth = isFullscreenWidth ? '100%' : '1300px';
        applyTranslations();
    }

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('incarnon_lang', lang);
        applyTranslations();
        renderApp();
    }

    function applyTranslations() {
        const t = UI_TEXT[currentLang];
        document.getElementById('pageTitle').innerText = t.pageTitle;
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                el.innerText = t[key];
            }
        });

        // Обновляем текст кнопки полноэкранного режима
        const fsBtn = document.getElementById('fullscreenBtn');
        fsBtn.innerText = isFullscreenWidth ? t.fullscreenOff : t.fullscreenOn;
    }

    function getAllAdapterIds() {
        let ids = [];
        categoriesData.forEach(cat => {
            cat.adapters.forEach(adapter => {
                ids.push(adapter.id);
            });
        });
        return ids;
    }

    function exportData() {
        const ids = getAllAdapterIds();
        let binaryString = "";
        ids.forEach(id => {
            const isChecked = localStorage.getItem('incarnon_' + id) === 'true';
            binaryString += isChecked ? "1" : "0";
        });

        let hexString = "";
        for (let i = 0; i < binaryString.length; i += 4) {
            let chunk = binaryString.substr(i, 4).padEnd(4, "0");
            hexString += parseInt(chunk, 2).toString(16);
        }

        const t = UI_TEXT[currentLang].alerts;
        navigator.clipboard.writeText(hexString).then(() => {
            alert(t.copied + hexString);
        }).catch(err => {
            prompt(t.promptExport, hexString);
        });
    }

    function importData() {
        const t = UI_TEXT[currentLang].alerts;
        let hexString = prompt(t.promptImport);
        if (!hexString) return;

        hexString = hexString.trim();
        let binaryString = "";

        for (let i = 0; i < hexString.length; i++) {
            let val = parseInt(hexString[i], 16);
            if (isNaN(val)) {
                alert(t.errorImport);
                return;
            }
            binaryString += val.toString(2).padStart(4, "0");
        }

        const ids = getAllAdapterIds();
        ids.forEach((id, index) => {
            const bit = binaryString[index] === "1";
            localStorage.setItem('incarnon_' + id, bit ? 'true' : 'false');
        });

        renderApp();
        alert(t.successImport);
    }

    function renderApp() {
        applyTranslations();
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';
        const t = UI_TEXT[currentLang];

        categoriesData.forEach(cat => {
            const section = document.createElement('div');
            section.className = 'category-section';
            
            const catTitle = t.categories[cat.categoryKey] || cat.categoryKey;
            
            let gridHtml = `<div class="adapter-grid">`;
            cat.adapters.forEach(adapter => {
                const isChecked = localStorage.getItem('incarnon_' + adapter.id) === 'true';
                const weaponName = currentLang === 'en' ? adapter.nameEn : adapter.nameRu;
                
                let costsList = '';
                for (let [resKey, amount] of Object.entries(adapter.costs)) {
                    const res = RESOURCE_NAMES[resKey] || { nameRu: resKey, nameEn: resKey, img: '' };
                    const resName = currentLang === 'en' ? res.nameEn : res.nameRu;
                    costsList += `
                        <li>
                            <div class="li-res-left">
                                <img src="${res.img}" class="list-icon" alt="">
                                <span>${resName}:</span>
                            </div>
                            <strong>${amount.toLocaleString()}</strong>
                        </li>`;
                }

                gridHtml += `
                    <div class="adapter-card ${isChecked ? 'completed' : ''}" id="card_${adapter.id}">
                        <div class="adapter-content">
                            <img src="${adapter.img}" class="weapon-img" alt="">
                            <div class="adapter-details">
                                <div class="adapter-header">
                                    <span class="adapter-title">${weaponName}</span>
                                    <label class="checkbox-label">
                                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleAdapter('${adapter.id}')"> ${t.installed}
                                    </label>
                                </div>
                                <ul>
                                    ${costsList}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            });
            gridHtml += `</div>`;

            section.innerHTML = `<h2>${catTitle}</h2>` + gridHtml;
            container.appendChild(section);
        });

        updateTotals();
    }

    function toggleAdapter(id) {
        const checkbox = document.querySelector(`#card_${id} input[type="checkbox"]`);
        const card = document.getElementById(`card_${id}`);
        
        if (checkbox.checked) {
            localStorage.setItem('incarnon_' + id, 'true');
            card.classList.add('completed');
        } else {
            localStorage.setItem('incarnon_' + id, 'false');
            card.classList.remove('completed');
        }
        updateTotals();
    }

    function resetAll() {
        categoriesData.forEach(cat => {
            cat.adapters.forEach(adapter => {
                localStorage.setItem('incarnon_' + adapter.id, 'false');
            });
        });
        renderApp();
    }

    function updateTotals() {
        const totals = {};
        Object.keys(RESOURCE_NAMES).forEach(key => {
            totals[key] = 0;
        });

        categoriesData.forEach(cat => {
            cat.adapters.forEach(adapter => {
                const isChecked = localStorage.getItem('incarnon_' + adapter.id) === 'true';
                if (!isChecked) {
                    for (let [resKey, amount] of Object.entries(adapter.costs)) {
                        if (totals[resKey] !== undefined) {
                            totals[resKey] += amount;
                        } else {
                            totals[resKey] = (totals[resKey] || 0) + amount;
                        }
                    }
                }
            });
        });

        const totalsContainer = document.getElementById('totalsContainer');
        totalsContainer.innerHTML = '';

        for (let [resKey, totalAmount] of Object.entries(totals)) {
            if (totalAmount > 0) {
                const res = RESOURCE_NAMES[resKey] || { nameRu: resKey, nameEn: resKey, img: '' };
                const resName = currentLang === 'en' ? res.nameEn : res.nameRu;
                const item = document.createElement('div');
                item.className = 'res-total-item';
                item.innerHTML = `
                    <div class="res-info-wrapper">
                        <img src="${res.img}" class="res-icon" alt="">
                        <span class="res-name">${resName}</span>
                    </div>
                    <span class="res-count">${totalAmount.toLocaleString()}</span>
                `;
                totalsContainer.appendChild(item);
            }
        }
    }

    window.onload = () => {
        initSettings();
        renderApp();
    };
</script>

</body>
</html>
