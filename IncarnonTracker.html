<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Трекер Инкарнон Адаптеров (Warframe)</title>
    <link rel="icon" href="https://ru.wiki.warframe.com/images/Favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-sub: #2a2a2a;
            --accent: #00bcd4;
            --accent-hover: #008ba3;
            --warning: #ff9800;
            --text-main: #e0e0e0;
            --text-muted: #999;
            --border: #333;
            --max-width: 1300px;
            --font-scale: 1rem;
            --green-ready: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.25);
        }

        [data-theme="light"] {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --card-sub: #f0f2f5;
            --accent: #009688;
            --accent-hover: #00796b;
            --warning: #f57c00;
            --text-main: #212121;
            --text-muted: #666;
            --border: #dcdcdc;
            --green-ready: #16a34a;
            --green-glow: rgba(22, 163, 74, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            font-size: var(--font-scale);
            transition: background-color 0.3s, color 0.3s, font-size 0.3s;
        }
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            transition: max-width 0.3s ease;
        }
        .top-settings-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        
        /* Блок текущей недели */
        .current-week-banner {
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.15), rgba(255, 152, 0, 0.15));
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .current-week-title {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 5px;
        }
        .current-week-weapons {
            font-size: 0.95em;
            color: var(--text-main);
        }

        /* Прогресс-бар общий */
        .global-progress-bar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95em;
        }
        .progress-track {
            background: var(--card-sub);
            border-radius: 4px;
            height: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .dashboard {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .dashboard h3 {
            margin-top: 0;
            color: var(--warning);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .warehouse-toggle-btn {
            font-size: 0.8em;
            background: var(--card-sub);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 4px 10px;
        }
        .warehouse-toggle-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        /* Панель склада */
        .warehouse-panel {
            display: none;
            background: var(--card-sub);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px dashed var(--border);
        }
        .warehouse-panel.open {
            display: block;
        }
        .warehouse-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .warehouse-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .warehouse-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .warehouse-item input {
            width: 60px;
            background: var(--card-sub);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 3px 5px;
            text-align: right;
            font-weight: bold;
        }

        .res-totals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .res-total-item {
            background: var(--card-sub);
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent);
        }
        .res-info-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .res-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .res-name {
            font-size: 0.95em;
            color: var(--text-main);
        }
        .res-counts {
            text-align: right;
        }
        .res-count-main {
            font-weight: bold;
            font-size: 1.05em;
            color: var(--accent);
        }
        .res-count-sub {
            font-size: 0.75em;
            color: var(--text-muted);
        }

        /* Панель фильтров и поиска */
        .filters-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-wrapper {
            position: relative;
            flex-grow: 1;
            min-width: 250px;
            display: flex;
            align-items: center;
        }
        .search-input {
            width: 100%;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 9px 35px 9px 15px;
            border-radius: 4px;
            font-size: 0.95em;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .search-clear-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1em;
            padding: 0;
            display: none;
        }
        .search-clear-btn:hover {
            color: var(--text-main);
            background: transparent;
        }

        .category-section {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .category-section.hidden {
            display: none !important;
        }
        h2 {
            color: var(--warning);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .adapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        /* Анимация подпрыгивания карточки при клике */
        @keyframes cardBounce {
            0% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0); }
        }
        .adapter-card.bounce {
            animation: cardBounce 0.3s ease;
        }

        /* Пульсация зелёной рамки */
        @keyframes greenPulse {
            0%, 100% { box-shadow: 0 0 10px var(--green-glow), 0 0 25px rgba(34,197,94,0.08); }
            50% { box-shadow: 0 0 16px rgba(34,197,94,0.35), 0 0 35px rgba(34,197,94,0.12); }
        }

        .adapter-card {
            background: var(--card-sub);
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 6px;
            transition: opacity 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.3s, border 0.3s;
            position: relative;
        }
        .adapter-card.current-week {
            border-left-color: #ff9800;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.3);
        }
        .current-badge {
            display: inline-block;
            background: #ff9800;
            color: #121212;
            font-size: 0.7em;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .adapter-card.hidden {
            display: none !important;
        }
        .adapter-card.completed {
            opacity: 0.5;
            border-left-color: #555;
        }

        /* ===== ЗЕЛЁНАЯ РАМКА: обе кнопки активны ===== */
        .adapter-card.both-active {
            opacity: 1 !important;
            border: 1.5px solid var(--green-ready);
            border-left: 4px solid var(--green-ready);
            animation: greenPulse 2.5s ease-in-out infinite;
        }
        .adapter-card.both-active.current-week {
            border-color: var(--green-ready);
            border-left-color: var(--green-ready);
        }

        .adapter-content {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .weapon-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            padding: 4px;
            flex-shrink: 0;
        }
        .adapter-details {
            flex-grow: 1;
        }
        .adapter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .adapter-title {
            font-weight: bold;
            font-size: 1em;
            color: var(--text-main);
        }

        /* ===== СВЕТЯЩИЕСЯ КНОПКИ-ИНДИКАТОРЫ ===== */
        .adapter-toggles {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .glow-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s ease;
            outline: none;
            font-family: inherit;
            white-space: nowrap;
        }
        .glow-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        /* Точка-индикатор */
        .glow-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        /* Hover на выключенной */
        .glow-btn:not(.active):hover {
            border-color: #555;
            background: #333;
        }
        [data-theme="light"] .glow-btn:not(.active):hover {
            background: #e8e8e8;
            border-color: #aaa;
        }

        /* — Установлен: активен (циан) — */
        .glow-btn.installed:not(.active):hover .dot {
            background: rgba(0, 188, 212, 0.45);
        }
        .glow-btn.installed.active {
            color: #0e1c1f;
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(0,188,212,0.45), 0 0 18px rgba(0,188,212,0.15);
        }
        .glow-btn.installed.active .dot {
            background: #0e1c1f;
            box-shadow: 0 0 4px rgba(14,28,31,0.4);
        }

        /* — Получен: активен (оранж) — */
        .glow-btn.received:not(.active):hover .dot {
            background: rgba(255, 152, 0, 0.45);
        }
        .glow-btn.received.active {
            color: #1a1000;
            background: var(--warning);
            border-color: var(--warning);
            box-shadow: 0 0 8px rgba(255,152,0,0.45), 0 0 18px rgba(255,152,0,0.15);
        }
        .glow-btn.received.active .dot {
            background: #1a1000;
            box-shadow: 0 0 4px rgba(26,16,0,0.4);
        }

        ul {
            margin: 0;
            padding-left: 0;
            list-style: none;
            font-size: 0.9em;
            color: var(--text-muted);
        }
        li {
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .li-res-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .list-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .controls-bar {
            text-align: right;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        button, select {
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        button:hover, select:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }
        select {
            background-color: var(--card-sub);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-share {
            background-color: #2196F3;
            color: white;
        }
        .btn-share:hover {
            background-color: #1976D2;
        }
        .btn-fullscreen {
            background-color: #9c27b0;
            color: white;
        }
        .btn-fullscreen:hover {
            background-color: #7b1fa2;
        }
        .btn-export {
            background-color: #4CAF50;
            color: white;
        }
        .btn-export:hover {
            background-color: #388E3C;
        }
        .btn-small-danger {
            background-color: #e53935;
            color: white;
            font-size: 0.8em;
            padding: 4px 10px;
        }
        .btn-small-danger:hover {
            background-color: #c62828;
            color: white;
        }

        /* Плавающая кнопка «Наверх» */
        .back-to-top {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--accent);
            color: #121212;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            box-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s, background-color 0.2s;
            z-index: 1000;
            border: none;
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        .back-to-top:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        /* Кнопка сброса фильтров внутри поиска */
        .search-reset-inline {
            position: absolute;
            right: 35px;
            background: transparent;
            border: none;
            color: var(--warning);
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            display: none;
            padding: 0 5px;
        }
    </style>
</head>
<body data-theme="dark">

<div class="container" id="mainContainer">
    <div class="top-settings-bar">
        <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
            <option value="1rem" data-i18n="fontNormal">А Шрифт: Обычный</option>
            <option value="1.15rem" data-i18n="fontLarge">А+ Крупный</option>
            <option value="1.3rem" data-i18n="fontMax">А++ Максимальный</option>
        </select>
        <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>
        <button id="themeToggleBtn" onclick="toggleTheme()">🌓 <span data-i18n="themeBtn">Тема</span></button>
    </div>

    <h1 data-i18n="mainTitle">Трекер Инкарнон Адаптеров</h1>
    <div class="subtitle" data-i18n="subTitle">Интерактивный трекер ресурсов для улучшений оружия</div>

    <div class="current-week-banner" id="currentWeekBanner">
        <div class="current-week-title" id="currentWeekTitle">Загрузка информации о неделе...</div>
        <div class="current-week-weapons" id="currentWeekWeapons"></div>
    </div>

    <div class="global-progress-bar">
        <div class="progress-info">
            <span id="progressText">Установлено: 0 из 0 (0%)</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="dashboard">
        <h3>
            <span data-i18n="dashboardTitle">Общие требования для не установленных адаптеров</span>
            <button class="warehouse-toggle-btn" onclick="toggleWarehouse()" data-i18n="warehouseToggle">📦 Мой склад ресурсов</button>
        </h3>
        
        <div class="warehouse-panel" id="warehousePanel">
            <div class="warehouse-header-row">
                <div style="font-size: 0.9em; color: var(--text-muted);" data-i18n="warehouseDesc">Укажи, сколько ресурсов у тебя уже есть. Трекер автоматически вычтет их из общего дефицита:</div>
                <button class="btn-small-danger" onclick="resetWarehouseWithConfirm()" data-i18n="resetWarehouseBtn">Сбросить склад</button>
            </div>
            <div class="warehouse-grid" id="warehouseContainer"></div>
        </div>

        <div class="res-totals-grid" id="totalsContainer"></div>
    </div>

    <div class="filters-bar">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Быстрый поиск оружия..." oninput="handleSearchInput()" data-i18n-placeholder="searchPlaceholder">
            <button id="searchResetInline" class="search-reset-inline" onclick="resetAllFilters()" title="Сбросить фильтры" data-i18n="searchResetBtn">Сбросить</button>
            <button id="searchClearBtn" class="search-clear-btn" onclick="clearSearch()" title="Сбросить поиск">✕</button>
        </div>
        <select id="statusFilter" onchange="filterAdapters()">
            <option value="all" data-i18n="filterAll">Все адаптеры</option>
            <option value="uninstalled" data-i18n="filterUninstalled">Только не установленные</option>
            <option value="installed" data-i18n="filterInstalled">Только установленные</option>
            <option value="current" data-i18n="filterCurrent">⚡ Доступны на этой неделе</option>
        </select>
    </div>

    <div class="controls-bar">
        <button class="btn-export" onclick="exportToExcelCSV()">📊 <span data-i18n="exportExcelBtn">Экспорт в Excel (CSV)</span></button>
        <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreenWidth()">🖥️ На весь экран</button>
        <button class="btn-share" onclick="shareProgressLink()" data-i18n="shareBtn">🔗 Скопировать ссылку на прогресс</button>
        <button onclick="resetAllWithConfirm()" data-i18n="resetBtn">Сбросить все галочки</button>
    </div>

    <div id="categoriesContainer"></div>
</div>

<button class="back-to-top" id="backToTopBtn" onclick="scrollToTop()" title="Наверх">↑</button>

<script>
    const UI_TEXT = {
        ru: {
            pageTitle: "Трекер Инкарнон Адаптеров (Warframe)",
            mainTitle: "Трекер Инкарнон Адаптеров",
            subTitle: "Интерактивный трекер ресурсов для улучшений оружия",
            dashboardTitle: "Общие требования для не установленных адаптеров",
            warehouseToggle: "📦 Мой склад ресурсов",
            warehouseDesc: "Укажи, сколько ресурсов у тебя уже есть. Трекер автоматически вычтет их из общего дефицита:",
            resetWarehouseBtn: "Сбросить склад",
            shareBtn: "🔗 Скопировать ссылку",
            exportExcelBtn: "Экспорт в Excel (CSV)",
            resetBtn: "Сбросить все галочки",
            installed: "Установлен",
            received: "Получен",
            yes: "Да",
            no: "Нет",
            themeBtn: "Тема",
            fullscreenOn: "🖥️ На весь экран",
            fullscreenOff: "⏹️ Обычный вид",
            searchPlaceholder: "🔍 Быстрый поиск оружия...",
            searchResetBtn: "Сбросить",
            fontNormal: "А Шрифт: Обычный",
            fontLarge: "А+ Крупный",
            fontMax: "А++ Максимальный",
            filterAll: "Все адаптеры",
            filterUninstalled: "Только не установленные",
            filterInstalled: "Только установленные",
            filterCurrent: "⚡ Доступны на этой неделе",
            warehouseSub: "Всего: {total} | На складе: {stock}",
            warehouseEnough: "Хватает!",

    function getCurrentIncarnonRotation() {
        const anchorDate = Date.UTC(2026, 7, 24, 0, 0, 0); 
        const now = new Date();
        const nowUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours(), now.getUTCMinutes());
        const diffMs = nowUTC - anchorDate;
        const diffWeeks = Math.floor(diffMs / (1000 * 60 * 60 * 24 * 7));
        let currentWeekIndex = (8 + (diffWeeks % 9)) % 9;
        const weekLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
        return {
            letter: weekLetters[currentWeekIndex],
            adapters: incarnonRotationWeeks[currentWeekIndex]
        };
    }

    function updateCurrentWeekBanner() {
        const rotation = getCurrentIncarnonRotation();
        const t = UI_TEXT[currentLang];
        
        document.getElementById('currentWeekTitle').innerText = t.currentWeekLabel.replace('{week}', rotation.letter);
        
        let namesList = [];
        rotation.adapters.forEach(id => {
            categoriesData.forEach(cat => {
                cat.adapters.forEach(a => {
                    if (a.id === id) {
                        namesList.push(currentLang === 'en' ? a.nameEn.replace(' Incarnon Genesis', '') : a.nameRu.replace('Генезис Инкарнона: ', ''));
                    }
                });
            });
        });
        document.getElementById('currentWeekWeapons').innerText = namesList.join(' • ');
    }

    function getAllAdapterIds() {
        let ids = [];
        categoriesData.forEach(cat => cat.adapters.forEach(a => ids.push(a.id)));
        return ids;
    }

    /* Сохранение состояния: формат #installedHex|receivedHex */
    function saveState() {
        const ids = getAllAdapterIds();

        // Installed bits
        let binInstalled = "";
        ids.forEach(id => {
            binInstalled += localStorage.getItem('incarnon_' + id) === 'true' ? "1" : "0";
        });
        let hexInstalled = "";
        for (let i = 0; i < binInstalled.length; i += 4) {
            let chunk = binInstalled.substr(i, 4).padEnd(4, "0");
            hexInstalled += parseInt(chunk, 2).toString(16);
        }

        // Received bits
        let binReceived = "";
        ids.forEach(id => {
            binReceived += localStorage.getItem('incarnon_recv_' + id) === 'true' ? "1" : "0";
        });
        let hexReceived = "";
        for (let i = 0; i < binReceived.length; i += 4) {
            let chunk = binReceived.substr(i, 4).padEnd(4, "0");
            hexReceived += parseInt(chunk, 2).toString(16);
        }

        history.replaceState(null, "", "#" + hexInstalled + "|" + hexReceived);
    }

    function loadFromURLOrStorage() {
        const hash = window.location.hash.replace("#", "").trim();
        const ids = getAllAdapterIds();

        if (hash.length > 0) {
            const parts = hash.split("|");
            const hexInstalled = parts[0] || "";
            const hexReceived = parts[1] || "";

            // Parse installed
            let binInstalled = "";
            for (let i = 0; i < hexInstalled.length; i++) {
                let val = parseInt(hexInstalled[i], 16);
                if (!isNaN(val)) binInstalled += val.toString(2).padStart(4, "0");
            }
            ids.forEach((id, index) => {
                const bit = binInstalled[index] === "1";
                if (localStorage.getItem('incarnon_' + id) === null) {
                    localStorage.setItem('incarnon_' + id, bit ? 'true' : 'false');
                }
            });

            // Parse received
            if (hexReceived.length > 0) {
                let binReceived = "";
                for (let i = 0; i < hexReceived.length; i++) {
                    let val = parseInt(hexReceived[i], 16);
                    if (!isNaN(val)) binReceived += val.toString(2).padStart(4, "0");
                }
                ids.forEach((id, index) => {
                    const bit = binReceived[index] === "1";
                    if (localStorage.getItem('incarnon_recv_' + id) === null) {
                        localStorage.setItem('incarnon_recv_' + id, bit ? 'true' : 'false');
                    }
                });
            } else {
                ids.forEach(id => {
                    if (localStorage.getItem('incarnon_recv_' + id) === null) {
                        localStorage.setItem('incarnon_recv_' + id, 'false');
                    }
                });
            }
        } else {
            ids.forEach(id => {
                if (localStorage.getItem('incarnon_' + id) === null) {
                    localStorage.setItem('incarnon_' + id, 'false');
                }
                if (localStorage.getItem('incarnon_recv_' + id) === null) {
                    localStorage.setItem('incarnon_recv_' + id, 'false');
                }
            });
        }
    }

    }

    function exportToExcelCSV() {
        const t = UI_TEXT[currentLang];
        let csvContent = "\uFEFF";
        csvContent += t.csvHeaders.join(";") + "\n";

        categoriesData.forEach(cat => {
            const catName = t.categories[cat.categoryKey];
            cat.adapters.forEach(adapter => {
                const isInstalled = localStorage.getItem('incarnon_' + adapter.id) === 'true';
                const isReceived = localStorage.getItem('incarnon_recv_' + adapter.id) === 'true';
                const weaponName = currentLang === 'en' ? adapter.nameEn : adapter.nameRu;
                const installedStr = isInstalled ? t.yes : t.no;
                const receivedStr = isReceived ? t.yes : t.no;

                let costsParts = [];
                for (let [resKey, amount] of Object.entries(adapter.costs)) {
                    const res = RESOURCE_NAMES[resKey] || { nameRu: resKey, nameEn: resKey };
                    const resName = currentLang === 'en' ? res.nameEn : res.nameRu;
                    costsParts.push(`${resName}: ${amount}`);
                }
                const costsStr = costsParts.join(", ");

                const row = [
                    `"${catName}"`,
                    `"${weaponName.replace(/"/g, '""')}"`,
                    `"${installedStr}"`,
                    `"${receivedStr}"`,
                    `"${costsStr}"`
                ];
                csvContent += row.join(";") + "\n";
            });
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'Warframe_Incarnon_Progress.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function toggleWarehouse() {
        const panel = document.getElementById('warehousePanel');
        panel.classList.toggle('open');
    }

    function renderWarehouseInputs() {
        const container = document.getElementById('warehouseContainer');
        container.innerHTML = '';

        Object.keys(RESOURCE_NAMES).forEach(resKey => {
            const res = RESOURCE_NAMES[resKey];
            const resName = currentLang === 'en' ? res.nameEn : res.nameRu;
            const currentStock = localStorage.getItem('warehouse_' + resKey) || 0;

            const div = document.createElement('div');
            div.className = 'warehouse-item';
            div.innerHTML = `
                <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
                    <img src="${res.img}" style="width:18px; height:18px; object-fit:contain;" alt="">
                    <span style="font-size:0.85em; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;" title="${resName}">${resName}</span>
                </div>
                <input type="number" min="0" value="${currentStock}" onchange="updateWarehouseStock('${resKey}', this.value)">
            `;
            container.appendChild(div);
        });
    }

    function updateWarehouseStock(resKey, val) {
        const num = Math.max(0, parseInt(val) || 0);
        localStorage.setItem('warehouse_' + resKey, num);
        updateTotals();
    }

    function resetWarehouseWithConfirm() {
        const t = UI_TEXT[currentLang];
        if (confirm(t.confirmResetWarehouse)) {
            Object.keys(RESOURCE_NAMES).forEach(resKey => {
                localStorage.setItem('warehouse_' + resKey, '0');
            });
            renderWarehouseInputs();
            updateTotals();
        }
    }

    function handleSearchInput() {
        const input = document.getElementById('searchInput');
        const clearBtn = document.getElementById('searchClearBtn');
        if (input.value.length > 0) {
            clearBtn.style.display = 'block';
        } else {
            clearBtn.style.display = 'none';
        }
        filterAdapters();
    }

    function clearSearch() {
        const input = document.getElementById('searchInput');
        input.value = '';
        document.getElementById('searchClearBtn').style.display = 'none';
        filterAdapters();
        input.focus();
    }

    function resetAllFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('statusFilter').value = 'all';
        document.getElementById('searchClearBtn').style.display = 'none';
        filterAdapters();
    }

    /* ==========================================================================
       РЕНДЕР КАРТОЧЕК — заменена галочка на светящиеся кнопки
       ========================================================================== */
    function renderApp() {
        applyTranslations();
        renderWarehouseInputs();
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';
        const t = UI_TEXT[currentLang];
        const rotation = getCurrentIncarnonRotation();

        categoriesData.forEach(catData => {
            const section = document.createElement('div');
            section.className = 'category-section';
            section.dataset.category = catData.categoryKey;

            const catName = t.categories[catData.categoryKey];
            const total = catData.adapters.length;
            const installed = catData.adapters.filter(a => localStorage.getItem('incarnon_' + a.id) === 'true').length;

            const h2 = document.createElement('h2');
            h2.innerHTML = `${catName} <span style="font-size:0.7em; color:var(--text-muted);">${installed}/${total}</span>`;
            section.appendChild(h2);

            const grid = document.createElement('div');
            grid.className = 'adapter-grid';

            catData.adapters.forEach(adapter => {
                const isInstalled = localStorage.getItem('incarnon_' + adapter.id) === 'true';
                const isReceived = localStorage.getItem('incarnon_recv_' + adapter.id) === 'true';
                const isCurrentWeek = rotation.adapters.includes(adapter.id);
                const bothActive = isInstalled && isReceived;

                const card = document.createElement('div');
                let cardClasses = 'adapter-card';
                if (bothActive) cardClasses += ' both-active';
                else if (isInstalled) cardClasses += ' completed';
                if (isCurrentWeek) cardClasses += ' current-week';
                card.className = cardClasses;
                card.dataset.id = adapter.id;
                card.dataset.currentWeek = isCurrentWeek;

                const weaponName = currentLang === 'en' ? adapter.nameEn : adapter.nameRu;

                let costHtml = '';
                for (let [resKey, amount] of Object.entries(adapter.costs)) {
                    const res = RESOURCE_NAMES[resKey] || { nameRu: resKey, nameEn: resKey, img: '' };
                    const resName = currentLang === 'en' ? res.nameEn : res.nameRu;
                    costHtml += `<li><div class="li-res-left"><img class="list-icon" src="${res.img}" alt="">${resName}</div><span>${amount}</span></li>`;
                }

                card.innerHTML = `
                    <div class="adapter-content">
                        <img class="weapon-img" src="${adapter.img}" alt="${weaponName}">
                        <div class="adapter-details">
                            <div class="adapter-header">
                                <span class="adapter-title">${weaponName}${isCurrentWeek ? '<span class="current-badge">' + t.currentBadgeText + '</span>' : ''}</span>
                                <div class="adapter-toggles">
                                    <button class="glow-btn installed${isInstalled ? ' active' : ''}" onclick="toggleAdapter('${adapter.id}')" aria-pressed="${isInstalled}" aria-label="${t.installed}">
                                        <span class="dot"></span>
                                        <span>${t.installed}</span>
                                    </button>
                                    <button class="glow-btn received${isReceived ? ' active' : ''}" onclick="toggleReceived('${adapter.id}')" aria-pressed="${isReceived}" aria-label="${t.received}">
                                        <span class="dot"></span>
                                        <span>${t.received}</span>
                                    </button>
                                </div>
                            </div>
                            <ul>${costHtml}</ul>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            section.appendChild(grid);
            container.appendChild(section);
        });

        updateTotals();
        updateProgress();
        filterAdapters();
    }

    /* Переключение «Установлен» */
    function toggleAdapter(id) {
        const current = localStorage.getItem('incarnon_' + id) === 'true';
        const newVal = !current;
        localStorage.setItem('incarnon_' + id, newVal ? 'true' : 'false');
        saveState();

        const card = document.querySelector(`.adapter-card[data-id="${id}"]`);
        if (card) {
            const btn = card.querySelector('.glow-btn.installed');
            btn.classList.toggle('active', newVal);
            btn.setAttribute('aria-pressed', newVal);

            updateCardClasses(card, id);

            card.classList.add('bounce');
            setTimeout(() => card.classList.remove('bounce'), 300);
        }

        updateCategoryCounts();
        updateTotals();
        updateProgress();
    }

    /* Переключение «Получен» */
    function toggleReceived(id) {
        const current = localStorage.getItem('incarnon_recv_' + id) === 'true';
        const newVal = !current;
        localStorage.setItem('incarnon_recv_' + id, newVal ? 'true' : 'false');
        saveState();

        const card = document.querySelector(`.adapter-card[data-id="${id}"]`);
        if (card) {
            const btn = card.querySelector('.glow-btn.received');
            btn.classList.toggle('active', newVal);
            btn.setAttribute('aria-pressed', newVal);

            updateCardClasses(card, id);

            card.classList.add('bounce');
            setTimeout(() => card.classList.remove('bounce'), 300);
        }

        updateTotals();
        updateProgress();
    }

    /* Обновление классов карточки (completed / both-active) */
    function updateCardClasses(card, id) {
        const isInstalled = localStorage.getItem('incarnon_' + id) === 'true';
        const isReceived = localStorage.getItem('incarnon_recv_' + id) === 'true';
        const bothActive = isInstalled && isReceived;

        card.classList.remove('completed', 'both-active');

        if (bothActive) {
            card.classList.add('both-active');
        } else if (isInstalled) {
            card.classList.add('completed');
        }
    }

    /* Обновление счётчиков в заголовках категорий */
    function updateCategoryCounts() {
        const t = UI_TEXT[currentLang];
        categoriesData.forEach(catData => {
            const section = document.querySelector(`.category-section[data-category="${catData.categoryKey}"]`);
            if (!section) return;
            const catName = t.categories[catData.categoryKey];
            const total = catData.adapters.length;
            const installed = catData.adapters.filter(a => localStorage.getItem('incarnon_' + a.id) === 'true').length;
            const h2 = section.querySelector('h2');
            if (h2) h2.innerHTML = `${catName} <span style="font-size:0.7em; color:var(--text-muted);">${installed}/${total}</span>`;
        });
    }

    /* Прогресс-бар */
    function updateProgress() {
        const ids = getAllAdapterIds();
        const total = ids.length;
        const installed = ids.filter(id => localStorage.getItem('incarnon_' + id) === 'true').length;
        const pct = total > 0 ? Math.round(installed / total * 100) : 0;

        document.getElementById('progressText').innerText = `${UI_TEXT[currentLang].installed}: ${installed} ${currentLang === 'ru' ? 'из' : 'of'} ${total} (${pct}%)`;
        document.getElementById('progressPercent').innerText = pct + '%';
        document.getElementById('progressFill').style.width = pct + '%';
    }

    /* Обновление итогов ресурсов */
    function updateTotals() {
        const t = UI_TEXT[currentLang];
        const container = document.getElementById('totalsContainer');
        container.innerHTML = '';

        let totals = {};
        categoriesData.forEach(catData => {
            catData.adapters.forEach(adapter => {
                const isInstalled = localStorage.getItem('incarnon_' + adapter.id) === 'true';
                if (!isInstalled) {
                    for (let [resKey, amount] of Object.entries(adapter.costs)) {
                        totals[resKey] = (totals[resKey] || 0) + amount;
                    }
                }
            });
        });

        Object.keys(RESOURCE_NAMES).forEach(resKey => {
            const res = RESOURCE_NAMES[resKey];
            const total = totals[resKey] || 0;
            if (total === 0) return;

            const stock = parseInt(localStorage.getItem('warehouse_' + resKey)) || 0;
            const deficit = Math.max(0, total - stock);
            const resName = currentLang === 'en' ? res.nameEn : res.nameRu;

            const div = document.createElement('div');
            div.className = 'res-total-item';
            div.innerHTML = `
                <div class="res-info-wrapper">
                    <img class="res-icon" src="${res.img}" alt="">
                    <span class="res-name">${resName}</span>
                </div>
                <div class="res-counts">
                    <div class="res-count-main">${deficit}</div>
                    <div class="res-count-sub">${t.warehouseSub.replace('{total}', total).replace('{stock}', stock)}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    /* Фильтрация адаптеров */
    function filterAdapters() {
        const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
        const statusFilter = document.getElementById('statusFilter').value;
        const rotation = getCurrentIncarnonRotation();

        let hasVisible = { primary: false, secondary: false, melee: false };

        document.querySelectorAll('.adapter-card').forEach(card => {
            const id = card.dataset.id;
            const isInstalled = localStorage.getItem('incarnon_' + id) === 'true';
            const isCurrentWeek = rotation.adapters.includes(id);

            let adapterName = '';
            categoriesData.forEach(cat => cat.adapters.forEach(a => {
                if (a.id === id) adapterName = currentLang === 'en' ? a.nameEn : a.nameRu;
            }));

            let visible = true;

            if (searchVal && !adapterName.toLowerCase().includes(searchVal)) {
                visible = false;
            }

            if (statusFilter === 'uninstalled' && isInstalled) visible = false;
            if (statusFilter === 'installed' && !isInstalled) visible = false;
            if (statusFilter === 'current' && !isCurrentWeek) visible = false;

            card.classList.toggle('hidden', !visible);

            if (visible) {
                const cat = card.closest('.category-section');
                if (cat) hasVisible[cat.dataset.category] = true;
            }
        });

        document.querySelectorAll('.category-section').forEach(section => {
            const catKey = section.dataset.category;
            section.classList.toggle('hidden', !hasVisible[catKey]);
        });

        const resetBtn = document.getElementById('searchResetInline');
        resetBtn.style.display = (searchVal || statusFilter !== 'all') ? 'inline' : 'none';
    }

    /* Сброс всех галочек */
    function resetAllWithConfirm() {
        const t = UI_TEXT[currentLang];
        if (confirm(t.confirmResetAll)) {
            const ids = getAllAdapterIds();
            ids.forEach(id => {
                localStorage.setItem('incarnon_' + id, 'false');
                localStorage.setItem('incarnon_recv_' + id, 'false');
            });
            saveState();
            renderApp();
        }
    }

    /* Наверх */
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
        const btn = document.getElementById('backToTopBtn');
        btn.classList.toggle('visible', window.scrollY > 400);
    });

    /* Инициализация */
    initSettings();
    renderApp();
</script>
</body>
</html>
